# Build + deploy meja-hijau ke GitHub Pages tiap push; drip terjadwal ACAK.
# Cron tiap hari + gate acak (min jeda 2 hari, ~0.6/hari) → gap ~2-4 hari acak.
name: deploy-meja-hijau
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '7 13 * * *' # ~20:07 WIB tiap hari; gate acak yang menentukan rilis.
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-meja-hijau
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate acak (min jeda 2 hari, lalu ~0.6/hari)
        id: gate
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git log --grep='auto-release' -1 --date=short --pretty=%ad || true)
          today=$(TZ=Asia/Jakarta date +%F)
          go=yes
          if [ -n "$last" ]; then
            gap=$(( ($(date -d "$today" +%s) - $(date -d "$last" +%s)) / 86400 ))
            [ "$gap" -lt 2 ] && go=no
          fi
          if [ "$go" = yes ] && [ $((RANDOM % 5)) -ge 3 ]; then go=no; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "GATE event=${{ github.event_name }} last=$last go=$go"
      - name: Rilis 1 artikel (hanya terjadwal/manual)
        id: rel
        if: github.event_name != 'push' && steps.gate.outputs.go == 'yes'
        env:
          DRIP_MODE: prefix_flag
          DRIP_CONTENT_DIR: src/content/articles
        run: bash .github/scripts/release.sh . 1 Asia/Jakarta
      - name: Commit status maju
        if: github.event_name != 'push' && steps.gate.outputs.go == 'yes' && steps.rel.outputs.released_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto-release: 1 artikel (${{ steps.rel.outputs.release_date }})"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps (tanpa lockfile -> npm install)
        run: npm install
      - name: Build Astro
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
